<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پل فایل</title><style>*{box-sizing:border-box}body{margin:0;background:#fff3f2;color:#202940;font:16px Tahoma,Arial}header{padding:38px 18px;text-align:center;background:linear-gradient(130deg,#ffaaa0,#fd696e);color:white}h1{font-size:35px;margin:0}main{max-width:800px;margin:auto;padding:12px}section{background:white;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #b95d5d15}li{display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;padding:12px 0;border-bottom:1px solid #eee;overflow-wrap:anywhere}ul{padding:0}a,button{background:#ef6971;color:white;border:0;border-radius:12px;padding:10px 18px;text-decoration:none;cursor:pointer}small{display:block;color:#888}input{max-width:100%}</style></head><body><header><h1>پل فایل</h1><p>انتقال دوطرفه فایل در شبکه محلی</p></header><main><section><h2>فایل‌های گوشی</h2><ul>ROWS</ul></section><section><h2>ارسال فایل به گوشی</h2><input id="f" type="file" multiple><p><button id="send">ارسال فایل</button></p><p id="msg"></p></section></main><script>document.getElementById('send').onclick=async()=>{const files=document.getElementById('f').files;const msg=document.getElementById('msg');if(!files.length){msg.textContent='فایل انتخاب کنید';return;}for(const file of files){msg.textContent='در حال ارسال: '+file.name;try{const r=await fetch('/upload?name='+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});if(!r.ok)throw Error(await r.text());msg.textContent='ارسال شد: '+file.name;}catch(e){msg.textContent='خطا: '+e.message;return;}}};</script></body></html>
